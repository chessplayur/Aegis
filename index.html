<script>
(() => {
  'use strict';

  // =========================
  // CONFIG
  // =========================
  const PROS = {
    valorant: [
      { id:'tenz', name:'TenZ', team:'Sentinels' },
      { id:'demon1', name:'Demon1', team:'EG' },
      { id:'aspas', name:'Aspas', team:'Leviatán' },
    ],
    cs2: [
      { id:'s1mple', name:'s1mple', team:'NAVI' },
      { id:'zywoo', name:'ZywOo', team:'Vitality' },
      { id:'donk', name:'donk', team:'Spirit' },
    ],
    lol: [
      { id:'faker', name:'Faker', team:'T1' },
      { id:'chovy', name:'Chovy', team:'GenG' },
      { id:'caps', name:'Caps', team:'G2' },
    ],
    apex: [
      { id:'imperialhal', name:'ImperialHal', team:'TSM' },
      { id:'genburten', name:'Genburten', team:'DZ' },
      { id:'zer0', name:'Zer0', team:'TSM' },
    ],
  };

  // LOCAL FALLBACKS
  const DEMO_VIDEO = './assets/demo.mp4';
  const PRO_VIDEO  = './assets/pro.mp4';

  const MAX_SIZE = 500 * 1024 * 1024;

  // =========================
  // STATE
  // =========================
  const state = {
    file: null,
    game: '',
    pro: '',
    playerSrc: null,
    proSrc: null,
    analyzed: false,
    ghost: false,
    telemetryTimer: null,
    launched: false,
    lastReport: null,
  };

  // =========================
  // HELPERS
  // =========================
  const $ = id => document.getElementById(id);

  function toast(msg, type='') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;

    clearTimeout(window.__toastTimeout);

    window.__toastTimeout = setTimeout(() => {
      t.className = 'toast';
    }, 3000);
  }

  function log(msg) {
    const row = document.createElement('div');

    row.className = 'log-item';

    row.innerHTML = `
      <time>${new Date().toLocaleTimeString()}</time>
      <span>${msg}</span>
    `;

    $('activityLog').prepend(row);
  }

  function safePlay(video) {
    if (!video) return;

    const promise = video.play();

    if (promise !== undefined) {
      promise.catch(() => {
        console.warn('Autoplay blocked');
      });
    }
  }

  function syncVideos() {
    const player = $('playerVideo');
    const pro = $('proVideo');
    const ghost = $('ghostVideo');

    const current = player.currentTime || 0;

    pro.currentTime = current;
    ghost.currentTime = current;
  }

  function updateStatus(text, ready=false) {
    const status = $('statusBox');

    status.textContent = text;

    status.className = ready
      ? 'status ready'
      : 'status';
  }

  // =========================
  // GAME SELECT
  // =========================
  $('gameSelect').addEventListener('change', e => {
    state.game = e.target.value;

    const sel = $('proSelect');

    if (!state.game) {
      sel.disabled = true;
      sel.innerHTML =
        '<option value="">— Select a game first —</option>';

      return;
    }

    sel.disabled = false;

    sel.innerHTML =
      '<option value="">— Choose a professional —</option>' +
      PROS[state.game]
        .map(p => `
          <option value="${p.id}">
            ${p.name} · ${p.team}
          </option>
        `)
        .join('');

    log(`Loaded ${state.game} professional models`);
  });

  // =========================
  // PRO SELECT
  // =========================
  $('proSelect').addEventListener('change', e => {
    state.pro = e.target.value;

    if (!state.pro) return;

    const proObj =
      PROS[state.game]
        .find(p => p.id === state.pro);

    $('proVideo').src = PRO_VIDEO;

    $('proVideo').load();

    $('proLabel').textContent =
      `${proObj.name.toUpperCase()} · ${proObj.team}`;

    state.proSrc = PRO_VIDEO;

    refreshReadiness();

    log(`Professional baseline initialized: ${proObj.name}`);
  });

  // =========================
  // FILE UPLOAD
  // =========================
  $('uploadBtn').addEventListener('click', () => {
    $('fileInput').click();
  });

  $('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) {
      handleFile(e.target.files[0]);
    }
  });

  function cleanupOldBlob() {
    if (
      state.playerSrc &&
      state.playerSrc.startsWith('blob:')
    ) {
      URL.revokeObjectURL(state.playerSrc);
    }
  }

  function handleFile(file) {
    if (!file) return;

    if (!file.type.startsWith('video/')) {
      toast('Unsupported file format', 'error');
      return;
    }

    if (file.size > MAX_SIZE) {
      toast('File exceeds 500MB limit', 'error');
      return;
    }

    cleanupOldBlob();

    const blob = URL.createObjectURL(file);

    state.file = file;
    state.playerSrc = blob;

    const player = $('playerVideo');
    const ghost = $('ghostVideo');

    player.src = blob;
    ghost.src = blob;

    player.load();
    ghost.load();

    $('uploadFile').textContent =
      `✓ ${file.name}`;

    $('playerLabel').textContent =
      'PLAYER FOOTAGE READY';

    log(`Gameplay uploaded: ${file.name}`);

    toast('Gameplay loaded successfully', 'success');

    refreshReadiness();
  }

  // =========================
  // DEMO MODE
  // =========================
  $('demoBtn').addEventListener('click', async () => {

    state.file = {
      name: 'demo-session.mp4',
      size: 1024
    };

    state.playerSrc = DEMO_VIDEO;

    const player = $('playerVideo');
    const ghost = $('ghostVideo');

    player.src = DEMO_VIDEO;
    ghost.src = DEMO_VIDEO;

    player.load();
    ghost.load();

    $('uploadFile').textContent =
      '✓ demo-session.mp4';

    $('playerLabel').textContent =
      'DEMO SESSION ACTIVE';

    refreshReadiness();

    toast('Demo environment initialized', 'success');

    log('Demo gameplay session loaded');

    await player.play().catch(()=>{});

    ghost.pause();
  });

  // =========================
  // READY CHECK
  // =========================
  function refreshReadiness() {

    const ready =
      state.file &&
      state.game &&
      state.pro;

    $('launchBtn').disabled = !ready;

    if (ready) {
      updateStatus(
        '✓ Ready for neural analysis',
        true
      );
    } else {
      updateStatus(
        'Awaiting upload, game selection, and pro baseline'
      );
    }
  }

  // =========================
  // LAUNCH
  // =========================
  $('launchBtn').addEventListener('click', () => {

    if (state.launched) return;

    state.launched = true;

    $('workspace').classList.add('show');

    [
      'syncBtn',
      'pauseBtn',
      'ghostBtn',
      'analyzeBtn'
    ].forEach(id => {
      $(id).disabled = false;
    });

    startTelemetry();

    log('Analysis workspace initialized');

    toast('Workspace launched', 'success');
  });

  // =========================
  // PLAYBACK
  // =========================
  $('syncBtn').addEventListener('click', () => {

    syncVideos();

    safePlay($('playerVideo'));
    safePlay($('proVideo'));

    if (state.ghost) {
      safePlay($('ghostVideo'));
    }

    log('Playback synchronized');
  });

  $('pauseBtn').addEventListener('click', () => {

    [
      'playerVideo',
      'proVideo',
      'ghostVideo'
    ].forEach(id => {
      $(id).pause();
    });

    log('Playback paused');
  });

  $('ghostBtn').addEventListener('click', () => {

    state.ghost = !state.ghost;

    $('ghostBtn')
      .classList.toggle('active', state.ghost);

    $('ghostVideo')
      .classList.toggle('show', state.ghost);

    if (state.ghost) {

      $('ghostVideo').currentTime =
        $('playerVideo').currentTime;

      safePlay($('ghostVideo'));

    } else {

      $('ghostVideo').pause();
    }

    log(
      `Ghost overlay ${
        state.ghost ? 'enabled' : 'disabled'
      }`
    );
  });

  // =========================
  // TELEMETRY
  // =========================
  function startTelemetry() {

    if (state.telemetryTimer) {
      clearInterval(state.telemetryTimer);
    }

    state.telemetryTimer = setInterval(() => {

      const frame = 80 + Math.random()*18;
      const move = 65 + Math.random()*25;
      const input = 90 + Math.random()*40;
      const react = 170 + Math.random()*80;

      $('telFrame').style.width = frame + '%';
      $('telMove').style.width = move + '%';
      $('telInput').style.width = (input/2) + '%';
      $('telReact').style.width =
        (100 - react/4) + '%';

      $('telFrameVal').textContent =
        Math.round(frame) + '%';

      $('telMoveVal').textContent =
        Math.round(move) + '%';

      $('telInputVal').textContent =
        Math.round(input) + ' Hz';

      $('telReactVal').textContent =
        Math.round(react) + ' ms';

    }, 1500);
  }

  // =========================
  // VIDEO ERROR HANDLING
  // =========================
  [
    'playerVideo',
    'proVideo',
    'ghostVideo'
  ].forEach(id => {

    $(id).addEventListener('error', () => {

      toast(
        `Failed to load ${id}`,
        'error'
      );

      log(`Playback failure: ${id}`);
    });
  });

  // =========================
  // INIT
  // =========================
  log('Neural Pattern Engine online');
})();
</script>
