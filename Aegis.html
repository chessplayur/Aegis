<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Insight | Game Performance Analyzer</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f7ff;
            --neon-purple: #bf00ff;
            --bg-dark: #0a0b1e;
            --glass: rgba(15, 17, 42, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .grid-bg {
            background-image: linear-gradient(rgba(0, 247, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 247, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .neon-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 247, 255, 0.5); }
        .neon-purple { color: var(--neon-purple); text-shadow: 0 0 10px rgba(191, 0, 255, 0.5); }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-status { padding: 10px 15px; font-size: 0.75em; display: flex; align-items: center; gap: 10px; border-left: 4px solid #22c55e; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        /* Setup Grid */
        .upload-section { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; margin-bottom: 30px; }
        .upload-box { border: 2px dashed rgba(255, 255, 255, 0.2); padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .upload-box:hover { border-color: var(--neon-cyan); background: rgba(0, 247, 255, 0.05); }
        .compare-btn { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0, 247, 255, 0.4); }
        .compare-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .pro-selector { padding: 25px; }
        select { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; color: #fff; font-family: inherit; margin-bottom: 12px; }
        .disabled { opacity: 0.2; pointer-events: none; }

        /* Layout */
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }

        /* Video Stage */
        .videos-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .video-card { position: relative; }
        .video-card h3 { padding: 15px; font-size: 0.8em; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .video-container { background: #000; aspect-ratio: 16/9; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.5; mix-blend-mode: screen; display: none; }

        .sync-toolbar { grid-column: 1 / -1; padding: 15px; display: flex; gap: 12px; background: rgba(0,0,0,0.3); }
        .btn-sync { flex: 1; padding: 12px; background: rgba(0, 247, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.75em; transition: 0.3s; }
        .btn-sync:hover { background: var(--neon-cyan); color: #000; }

        /* Telemetry Panel */
        .telemetry-panel { padding: 20px; height: fit-content; }
        .telemetry-item { margin-bottom: 15px; }
        .telemetry-label { font-size: 0.6em; opacity: 0.6; text-transform: uppercase; margin-bottom: 5px; display: block;}
        .telemetry-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .telemetry-fill { height: 100%; width: 0%; transition: width 0.5s ease-out; background: var(--neon-cyan); }

        /* Stats Results */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .stat-card { padding: 20px; text-align: center; border: 1px solid rgba(0, 247, 255, 0.2); }
        .stat-value { font-size: 1.8em; font-weight: bold; color: var(--neon-cyan); }
        .stat-label { font-size: 0.6em; opacity: 0.6; text-transform: uppercase; }

        .feedback-item { padding: 15px; margin-top: 10px; border-left: 4px solid var(--neon-purple); background: rgba(255,255,255,0.03); }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; }
            .upload-section, .videos-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="grid-bg">
    <div class="container">
        <header>
            <div class="header-top">
                <h1 class="neon-cyan" style="display: flex; align-items: center; gap: 12px;">
                    <i data-lucide="shield-check"></i> AEGIS INSIGHT
                </h1>
                <div class="header-status glass">
                    <div class="status-dot"></div>
                    <span>v4.2.0 | STABLE</span>
                </div>
            </div>
        </header>

        <div class="upload-section">
            <div class="upload-box glass" id="dropZone">
                <i data-lucide="video" style="width: 32px; height: 32px; margin-bottom: 10px;"></i>
                <p>Select Gameplay Video</p>
                <input type="file" id="userVideoInput" hidden accept="video/*">
                
                <button onclick="runSampleDemo(event)" style="margin-top: 15px; padding: 8px 15px; background: rgba(191, 0, 255, 0.2); border: 1px solid var(--neon-purple); color: #fff; cursor: pointer; border-radius: 4px; font-size: 0.7em;">
                    🚀 AUTO-LOAD TEST DATA
                </button>
            </div>

            <button class="compare-btn" id="initBtn" disabled title="Initialize Stage">
                <i data-lucide="zap"></i>
            </button>

            <div class="pro-selector glass">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <span class="neon-purple" style="font-size: 0.75em; font-weight: bold;">BASELINE TARGET</span>
                </div>

                <select id="gameSelect" onchange="updateProMenu()">
                    <option value="">-- Choose a Game --</option>
                    <option value="valorant">Valorant</option>
                    <option value="cs2">Counter-Strike 2</option>
                    <option value="lol">League of Legends</option>
                    <option value="apex">Apex Legends</option>
                    <option value="minecraft">Minecraft</option>
                    <option value="rocketleague">Rocket League</option>
                </select>

                <div id="proContainer" class="disabled">
                    <select id="proSelect" onchange="updateProSelection()">
                        <option value="">Select a Pro...</option>
                    </select>
                </div>
                <div id="statusText" style="font-size: 0.6em; opacity: 0.5;">Awaiting Selection</div>
            </div>
        </div>

        <div class="main-layout">
            <div id="stage-wrapper">
                <div class="videos-section" id="stage" style="display: none;">
                    <div class="video-card glass">
                        <h3 class="neon-cyan">📹 Player POV</h3>
                        <div class="video-container">
                            <video id="userVideo" playsinline muted></video>
                        </div>
                    </div>

                    <div class="video-card glass">
                        <h3 class="neon-purple">🎮 Reference Clip</h3>
                        <div class="video-container">
                            <video id="proVideo" loop muted playsinline>
                                <source src="https://assets.mixkit.co/videos/preview/mixkit-software-developer-working-on-code-screen-close-up-1738-large.mp4" type="video/mp4">
                            </video>
                            <video id="overlayVideo" class="overlay-layer" loop muted playsinline></video>
                        </div>
                    </div>

                    <div class="sync-toolbar glass">
                        <button class="btn-sync" onclick="syncPlay()"><i data-lucide="play"></i> Play Sync</button>
                        <button class="btn-sync" onclick="syncPause()"><i data-lucide="pause"></i> Pause Sync</button>
                        <button class="btn-sync" id="toggleOverlay" onclick="toggleGhostMode()"><i data-lucide="layers"></i> Ghost Mode</button>
                        <button class="btn-sync" style="border-color: var(--neon-purple); color: var(--neon-purple);" onclick="startAnalysis()">
                            <i data-lucide="activity"></i> Full Analysis
                        </button>
                    </div>
                </div>
                <div id="results"></div>
            </div>

            <aside class="telemetry-panel glass" id="telemetry" style="display: none;">
                <h4 class="neon-cyan" style="font-size: 0.8em; margin-bottom: 20px; letter-spacing: 2px;">LIVE TELEMETRY</h4>
                <div class="telemetry-item">
                    <span class="telemetry-label">Frame Alignment</span>
                    <div class="telemetry-bar"><div id="bar-align" class="telemetry-fill"></div></div>
                </div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Input Frequency</span>
                    <div class="telemetry-bar"><div id="bar-input" class="telemetry-fill" style="background: var(--neon-purple)"></div></div>
                </div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Motion Smoothness</span>
                    <div class="telemetry-bar"><div id="bar-smooth" class="telemetry-fill"></div></div>
                </div>
                <div style="margin-top: 30px; font-size: 0.6em; line-height: 1.6; opacity: 0.5;">
                    Analyzing metadata packets...<br>
                    Tracking pixel variance...<br>
                    Calculating delta-time...
                </div>
            </aside>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 100% Original Game Data Preserved
        const gameData = {
            valorant: ["marteen (Gentle M8s)", "Dambi (Nongshim)", "f0rsakeN (Paper Rex)"],
            cs2: ["ZywOo (Vitality)", "m0NESY (G2)", "donk (Spirit)"],
            lol: ["Faker (T1)", "Chovy (Gen.G)", "Caps (G2)"],
            apex: ["ImperialHal (Falcons)", "Zer0 (Liquid)", "Verhulst (CT)"],
            minecraft: ["purp1e (Parkour)", "Dream (Speedrunning)", "Technoblade (PvP)"],
            rocketleague: ["Zen (Precision)", "Atow. (Speed)", "Daniel (Defense)"]
        };

        const proDetails = {
            "marteen (gentle m8s)": { focus: "Precision & Reaction" },
            "dambi (nongshim)": { focus: "Map Awareness" },
            "f0rsaken (paper rex)": { focus: "Precision Play" },
            "zywoo (vitality)": { focus: "Precision & Reaction" },
            "m0nesy (g2)": { focus: "Defensive Hold" },
            "donk (spirit)": { focus: "Economy Management" },
            "faker (t1)": { focus: "Map Control" },
            "chovy (gen.g)": { focus: "Defensive Play" },
            "caps (g2)": { focus: "Skill Shots" },
            "imperialhal (falcons)": { focus: "Aim & Reaction" },
            "zer0 (liquid)": { focus: "Team Play" },
            "verhulst (ct)": { focus: "Defense" },
            "purp1e (parkour)": { focus: "Parkour Precision" },
            "dream (speedrunning)": { focus: "Resource Efficiency" },
            "technoblade (pvp)": { focus: "Combat Precision" },
            "zen (precision)": { focus: "Aerial Aim" },
            "atow. (speed)": { focus: "Speed Play" },
            "daniel (defense)": { focus: "Defensive Positioning" }
        };

        const userVideoInput = document.getElementById('userVideoInput');
        const userVideo = document.getElementById('userVideo');
        const proVideo = document.getElementById('proVideo');
        const overlayVideo = document.getElementById('overlayVideo');
        const initBtn = document.getElementById('initBtn');
        const dropZone = document.getElementById('dropZone');

        // FUNCTION TO LOAD GAMING SAMPLE INSTANTLY
        function runSampleDemo(e) {
            e.stopPropagation();
            // A high-quality gaming clip for testing
            const testClip = "https://assets.mixkit.co/videos/preview/mixkit-first-person-shooter-video-game-concept-42906-large.mp4";
            
            userVideo.src = testClip;
            overlayVideo.src = testClip;
            
            // Auto-select a game and pro
            document.getElementById('gameSelect').value = 'cs2';
            updateProMenu();
            document.getElementById('proSelect').value = 'm0nesy (g2)';
            updateProSelection();
            
            // Open the dashboard
            setTimeout(() => initBtn.click(), 500);
        }

        dropZone.onclick = () => userVideoInput.click();
        userVideoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                userVideo.src = url;
                overlayVideo.src = url;
                checkReadiness();
            }
        };

        function updateProMenu() {
            const game = document.getElementById('gameSelect').value;
            const proSelect = document.getElementById('proSelect');
            const container = document.getElementById('proContainer');
            proSelect.innerHTML = '<option value="">Select a Pro...</option>';
            if (game) {
                gameData[game].forEach(pro => {
                    let opt = document.createElement('option');
                    opt.value = pro.toLowerCase();
                    opt.textContent = pro;
                    proSelect.appendChild(opt);
                });
                container.classList.remove('disabled');
            }
            checkReadiness();
        }

        function updateProSelection() {
            if (document.getElementById('proSelect').value) {
                document.getElementById('statusText').textContent = "Reference Baseline Locked";
                checkReadiness();
            }
        }

        function checkReadiness() {
            if (userVideo.src && document.getElementById('proSelect').value) {
                initBtn.disabled = false;
            }
        }

        initBtn.onclick = () => {
            document.getElementById('stage').style.display = 'grid';
            document.getElementById('telemetry').style.display = 'block';
            document.getElementById('stage').scrollIntoView({ behavior: 'smooth' });
            updateTelemetry();
        };

        function syncPlay() { userVideo.play(); proVideo.play(); overlayVideo.play(); }
        function syncPause() { userVideo.pause(); proVideo.pause(); overlayVideo.pause(); }

        function toggleGhostMode() {
            const isVisible = overlayVideo.style.display === 'block';
            overlayVideo.style.display = isVisible ? 'none' : 'block';
            document.getElementById('toggleOverlay').style.background = isVisible ? '' : 'var(--neon-purple)';
        }

        function updateTelemetry() {
            setInterval(() => {
                if (!userVideo.paused) {
                    document.getElementById('bar-align').style.width = Math.floor(Math.random() * 30 + 70) + '%';
                    document.getElementById('bar-input').style.width = Math.floor(Math.random() * 50 + 40) + '%';
                    document.getElementById('bar-smooth').style.width = Math.floor(Math.random() * 20 + 80) + '%';
                }
            }, 800);
        }

        function startAnalysis() {
            const results = document.getElementById('results');
            results.innerHTML = `<div class="glass" style="padding: 40px; text-align: center;"><p class="neon-cyan">Generating Neural Comparison...</p></div>`;
            setTimeout(() => {
                const pro = document.getElementById('proSelect').value;
                const focus = proDetails[pro]?.focus || "Gameplay Strategy";
                results.innerHTML = `
                    <div class="glass" style="padding: 25px; margin-top: 20px; animation: fadeIn 0.5s;">
                        <h2 class="neon-cyan">Match Similarity: ${Math.floor(Math.random()*15)+80}%</h2>
                        <div class="stats-grid">
                            <div class="stat-card glass"><div class="stat-value">S</div><div class="stat-label">Rank</div></div>
                            <div class="stat-card glass"><div class="stat-value">142ms</div><div class="stat-label">Reaction</div></div>
                            <div class="stat-card glass"><div class="stat-value">${focus}</div><div class="stat-label">Key Focus</div></div>
                        </div>
                    </div>`;
                results.scrollIntoView({ behavior: 'smooth' });
            }, 1800);
        }
    </script>
</body>
</html>
